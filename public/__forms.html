<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Balta Construct — служебная форма</title>
  </head>
  <body>
    <form
      name="estimate"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="estimate" />
      <input name="bot-field" />
      <input name="Тип объекта" />
      <input name="Виды работ" />
      <input name="Площадь фасада" />
      <input name="Желаемый срок" />
      <input name="Контактное лицо" />
      <input name="Телефон" />
      <input name="Компания" />
      <textarea name="Комментарий"></textarea>
      <input type="file" name="Файл" />
    </form>
  </body>
</html>
