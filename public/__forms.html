<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Balta Construct — служебная форма</title>
  </head>
  <body>
    <form
      name="estimate"
      method="POST"
      enctype="multipart/form-data"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="estimate" />
      <input name="bot-field" />
      <input name="objectType" />
      <input name="services" />
      <input name="area" />
      <input name="timeline" />
      <input name="name" />
      <input name="phone" />
      <input name="company" />
      <textarea name="comment"></textarea>
      <input type="file" name="attachment" />
    </form>
  </body>
</html>
